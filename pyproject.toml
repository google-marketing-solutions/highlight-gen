[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "highlight-gen"
version = "0.1.0"
description = "Generates Merchant Center product highlights with a locally hosted Gemma model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Google LLC" },
]
dependencies = [
    "absl-py",
    # Required by transformers when the pipeline is loaded with device_map.
    "accelerate",
    "kagglehub",
    # 13.0 fixes CVE-2026-96639 and CVE-2026-96778 in image decoding.
    "pillow>=13.0",
    "requests",
    # Backend for the transformers pipeline; not imported directly.
    "torch",
    "tqdm",
    # The image-text-to-text pipeline API used by highlight_gen.
    "transformers>=5",
]

[project.scripts]
highlight-gen = "highlight_gen:run"

[tool.setuptools]
py-modules = ["highlight_gen"]
